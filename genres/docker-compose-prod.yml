version: "3.8"

networks:
  traefik-public:
    external: true

services:
  genres-service:
    image: miguel04cardoso/genres-service:latest
    environment:
      - SPRING_PROFILES_ACTIVE=bootstrap,prod
      - SPRING_RABBITMQ_ADDRESSES=143.47.57.150:5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    networks:
      - traefik-public
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.40"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.genres.rule=PathPrefix(`/genres`)"
        - "traefik.http.routers.genres.entrypoints=web"
        - "traefik.http.middlewares.genres-strip.stripprefix.prefixes=/genres"
        - "traefik.http.routers.genres.middlewares=genres-strip"
        - "traefik.http.services.genres.loadbalancer.server.port=8085"