version: "3.8"

networks:
  traefik-public:
    external: true

services:
  auth-users-service:
    image: miguel04cardoso/auth-users-service:latest
    environment:
      - SPRING_PROFILES_ACTIVE=bootstrap,dev
      - SPRING_RABBITMQ_ADDRESSES=143.47.57.150:5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    networks:
      - traefik-public
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.40"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.users.rule=PathPrefix(`/users`)"
        - "traefik.http.routers.users.entrypoints=web"
        - "traefik.http.middlewares.users-strip.stripprefix.prefixes=/users"
        - "traefik.http.routers.users.middlewares=users-strip"
        - "traefik.http.services.users.loadbalancer.server.port=8081"

  auth-users-green:
    image: miguel04cardoso/auth-users-service:green
    environment:
      - SPRING_PROFILES_ACTIVE=bootstrap,dev
      - SPRING_RABBITMQ_ADDRESSES=143.47.57.150:5672
      - SPRING_RABBITMQ_USERNAME=guest
      - SPRING_RABBITMQ_PASSWORD=guest
    networks:
      - traefik-public
    deploy:
      replicas: 0
      resources:
        limits:
          cpus: "0.40"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.users.rule=PathPrefix(`/users`)"
        - "traefik.http.routers.users.entrypoints=web"
        - "traefik.http.middlewares.users-strip.stripprefix.prefixes=/users"
        - "traefik.http.routers.users.middlewares=users-strip"
        - "traefik.http.services.users.loadbalancer.server.port=8081"