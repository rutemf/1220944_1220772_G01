      replicas: 1
      resources:
        limits:
          cpus: "0.40"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.readers.rule=PathPrefix(`/readers`)"
      - "traefik.http.routers.readers.entrypoints=web"
      - "traefik.http.services.readers-v2.loadbalancer.server.port=8082"
      - "traefik.http.services.readers-v2.loadbalancer.weight=10"