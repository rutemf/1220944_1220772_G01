version: "3.8"

networks:
  traefik-public:
    external: true

services:
  traefik:
    image: traefik:2
    command:
      - "--providers.docker.swarmmode=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--api.insecure=true"
    ports:
      - "4677:80"
      - "8888:8080"
    networks:
      - traefik-public
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager

  rabbitmq:
    image: rabbitmq:3-management
    networks:
      - traefik-public
    deploy:
      replicas: 1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rabbitmq.rule=Host(`rabbitmq.localhost`)"
      - "traefik.http.services.rabbitmq.loadbalancer.server.port=15672"

  auth-users-service:
    image: miguel04cardoso/auth-users-service:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://143.47.57.150:3306/Auth-Users
    networks:
      - traefik-public
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.40"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/users`)"
      - "traefik.http.services.auth.loadbalancer.server.port=8081"

  authors-service:
    image: miguel04cardoso/authors-service:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://143.47.57.150:3306/Authors
    networks:
      - traefik-public
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.40"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authors.rule=PathPrefix(`/authors`)"
      - "traefik.http.services.auth.loadbalancer.server.port=8084"

  books-service:
    image: miguel04cardoso/books-service:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://143.47.57.150:3306/Books
    networks:
      - traefik-public
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.40"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.books.rule=PathPrefix(`/books`)"
      - "traefik.http.services.books.loadbalancer.server.port=8083"

  genres-service:
    image: miguel04cardoso/genres-service:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://143.47.57.150:3306/Authors
    networks:
      - traefik-public
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.40"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.genres.rule=PathPrefix(`/genres`)"
      - "traefik.http.services.auth.loadbalancer.server.port=8085"

  readers-v1:
    image: miguel04cardoso/readers-service:latest
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://143.47.57.150:3306/Readers
    networks:
      - traefik-public
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.40"
          memory: 512M
        reservations:
          cpus: "0.05"
          memory: 128M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.readers.rule=PathPrefix(`/readers`)"
      - "traefik.http.routers.readers.entrypoints=web"
      - "traefik.http.services.readers-v1.loadbalancer.server.port=8082"
      - "traefik.http.services.readers-v1.loadbalancer.weight=90"

  readers-v2:
    image: miguel04cardoso/readers-service:canary
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://143.47.57.150:3306/Readers
    networks:
      - traefik-public
